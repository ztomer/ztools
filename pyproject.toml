[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "otools"
version = "1.0.0"
description = "Local LLM tools for Osaurus"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.33.0",
    "rich>=14.0.0",
    "tomli-w>=1.2.0",
    "textual>=0.50.0",
]

[tool.setuptools.packages.find]
include = ["lib*", "twitter*", "weekend*", "rename*", "eval*", "conf*", "tui*"]

[tool.setuptools.package-data]
conf = ["*.toml", "*.json", "models/*.toml", "models/*.json"]

[project.optional-dependencies]
web = [
    "ddgs>=9.0.0",
    "beautifulsoup4>=4.12.0",
]
browser = [
    "playwright>=1.40.0",
    "cryptography>=41.0.0",
]
vision = [
    "pillow>=10.0.0",
    "pytesseract>=0.3.10",
]
foundation = [
    "apple-fm-sdk",
]
tui = [
    "textual>=0.50.0",
]
mlx = [
    "mlx-lm",
    "mlx-vlm",
]
all = [
    "ddgs>=9.0.0",
    "beautifulsoup4>=4.12.0",
    "cryptography>=41.0.0",
    "playwright>=1.40.0",
    "pillow>=10.0.0",
    "pytesseract>=0.3.10",
    "mlx-lm",
    "mlx-vlm",
    "textual>=0.50.0",
]

# Per-tool extrasets map a tool to the optional dependencies it needs.
weekend = ["ddgs>=9.0.0", "beautifulsoup4>=4.12.0"]
twitter = ["playwright>=1.40.0", "cryptography>=41.0.0"]
oeval = []

[project.scripts]
tw = "twitter.cli:main"
wk = "weekend.cli:main"
rn = "rename.cli:main"
ev = "eval.cli:main"
weekend = "weekend.cli:main"
twitter = "twitter.cli:main"
oeval = "eval.cli:main"
ztools = "tui.app:main"

[tool.rtk]
python = "3.14"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Test modules contain long string fixtures (JSON/HTML/date literals in deeply
# nested dicts). E501 there is purely cosmetic and reformatting risks altering
# fixture semantics, so line-too-long is relaxed for tests only.
"tests/**" = ["E501"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["lib", "weekend", "twitter", "rename", "eval"]
omit = ["*/tests/*", "*/__main__.py", "*/__init__.py", "eval/explore_quirks.py"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "def main\\(",
]