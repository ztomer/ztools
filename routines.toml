# routines manifest — how this project joins a scheduled routine.
# See ~/Projects/routines/docs/STATUS_CONTRACT.md

name = "ztools-weekend"
description = "weekend planner: scrape, filter to the home region, draft with a local model"

[run]
# Thursday evening, so the plan is ready before the weekend it covers. This
# cadence is only expressible because timing is per item now — under the old
# Daily|Weekly slot selector this would have fired at the one house-wide
# weekly instant along with everything else.
#
# A failure here most often means Osaurus is not serving: a wedged server
# answers /v1/models instantly while serving nothing (see PENDING 5.3).
command = "uv run --frozen wk"
schedule = "weekly on thu at 18:00"
# A full run scrapes the web and drives a 35B model; the 120s default would
# kill it and report a false failure.
timeout_ms = 1800000

[status]
# Read-only: reads back the newest plan from the configured output directory
# ($WEEKEND_OUTPUT_DIR) and counts its rows
# using the checkers' own parsers. Runs no model and touches no network.
command = "uv run --frozen python routines_status.py"
timeout_ms = 30000
