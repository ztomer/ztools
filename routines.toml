# routines manifest — how this project joins a scheduled routine.
# See the `routines` harness's docs/STATUS_CONTRACT.md

name = "ztools-weekend"
description = "weekend planner: scrape, filter to the home region, draft with a local model"

[run]
# Thursday evening, so the plan is ready before the weekend it covers. This
# cadence is only expressible because timing is per item now — under the old
# Daily|Weekly slot selector this would have fired at the one house-wide
# weekly instant along with everything else.
#
# A failure here most often means Osaurus is not serving: a wedged server
# answers /v1/models instantly while serving nothing (see PENDING 5.3).
# The native binary; the `uv run --frozen wk` Python entry point was retired
# 2026-09-13 with the rest of the Python runtime. Absolute path because the
# routines runner's PATH has no /opt/homebrew.
#
# THE OUTPUT PATH IS DERIVED, NOT TYPED. `--md-out` takes the extra `_latest`
# copy the tab reads, and it used to name one account's Documents folder
# outright -- a path that worked on the machine it was written on and nowhere
# else, and one the runner's `sh -c` had no way to vary. It is now the same
# seam `store::weekend_output_dir()` resolves: `WEEKEND_OUTPUT_DIR` when the
# operator has set it, else the documented store directory. The runner spawns
# every command through `sh -c`, so the expansion happens where the reader
# already looks, and the two halves cannot disagree about where plans live.
command = "/opt/homebrew/bin/ztools weekend-plan --md-out \"${WEEKEND_OUTPUT_DIR:-$HOME/Documents/weekend_plans}/weekend_plan_latest.md\""
# Thursday 18:00, as the comment above states. It read `weekly on mon at
# 08:00` while this block said Thursday evening; the two are now pinned
# together by rust/tests/routines_manifest.rs.
schedule = "weekly on thu at 18:00"
# A full run scrapes the web and drives a 35B model; the 120s default would
# kill it and report a false failure.
timeout_ms = 1800000

[status]
# Read-only: reads back the newest plan from the configured output directory
# ($WEEKEND_OUTPUT_DIR) and counts its rows
# using the checkers' own parsers. Runs no model and touches no network.
# `ztools status` is the Rust port of the retired `references/routines_status.py`;
# A/B on the real plan directory was a semantic-identical JSON diff.
command = "/opt/homebrew/bin/ztools status"
timeout_ms = 30000

[tab]
# A dashboard tab in the routines menubar. Read-only and cheap: the native
# `weekend-plan --fetch-latest` reads the newest stored plan back (the same
# discovery the status line uses), so opening the tab never re-plans. Absolute
# path because the menubar is a GUI process whose PATH has no /opt/homebrew.
# See the `routines` harness's docs/STATUS_CONTRACT.md
# `refresh` re-plans on demand (the same scrape + model pipeline `run` uses)
# into the same store the read side reads, so a refreshed tab shows the plan
# that was actually generated, not a stale one. The output path is derived
# (see `[run]`): the refresh writes where the status command reads.
id = "ztools-weekend"
title = "Weekend Plan"
command = "/opt/homebrew/bin/ztools weekend-plan --fetch-latest"
refresh = "/opt/homebrew/bin/ztools weekend-plan --md-out \"${WEEKEND_OUTPUT_DIR:-$HOME/Documents/weekend_plans}/weekend_plan_latest.md\""

# The operator's toggles (retention), shown in the routines Settings window.
# routines runs `<command> --json` to list them and `<command> set KEY VALUE`
# to change one; the list itself lives in `rust/src/ztools/settings.rs`.
[settings]
command = "/opt/homebrew/bin/ztools settings"
title = "ztools"
