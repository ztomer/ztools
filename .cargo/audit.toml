# cargo-audit configuration.
#
# PLACEMENT IS LOAD-BEARING, and this file used to be in the wrong place. It
# lived at rust/.cargo/audit.toml while the gate runs `cargo audit --file
# rust/Cargo.lock` FROM THE REPO ROOT (local_ci.sh cd's there first). cargo-audit
# resolves this file from the CURRENT DIRECTORY only — no parent walk, and
# certainly no walk into subdirectories — so for the whole life of the gate at
# that path the stanzas below were never read. Proven rather than assumed: a
# deliberately invalid `deny` class here makes `cargo audit` fail with a parse
# error naming this file, and the identical file in a parent directory is
# silently ignored. If you move this file, re-run that check.
#
# The `deny` stanza is load-bearing. `cargo audit` exits 0 on
# "unmaintained"/"unsound"/"yanked" — they are informational by default — so
# without it the gate would pass over exactly the class it is here to police.
# Calibrated 2026-10-04: with the deny list applied, the tree is CLEAN (258
# dependencies, zero advisories), so moving the file changed nothing today. It
# matters the day one lands. Calibrate any change by making it fail on purpose.
#
# THE IGNORE LIST. It is EMPTY, and that is the goal state. Wiring this gate
# (2026-09-07) immediately found one advisory — chacha20 0.10.1 was YANKED from
# crates.io — which was FIXED by updating to 0.10.2 rather than excused.
#
# Anything appearing here must carry the reason it may stand. What cargo-audit
# does NOT do is enforce that: an entry whose advisory no longer exists is
# accepted silently (calibrated 2026-10-04 — `ignore = ["RUSTSEC-2026-9999"]`
# passes clean), so "delete it once its advisory stops firing" is on whoever
# adds the entry, not on the tool. A stale exemption is a hole held open for the
# next real finding, which is why the list is empty rather than short.
[output]
quiet = false
deny = ["warnings", "unmaintained", "unsound", "yanked"]

[advisories]
ignore = []
