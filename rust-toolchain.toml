# The toolchain this repo's gates run on, pinned.
#
# WHY THIS FILE EXISTS. Every Rust gate in `.gatesrc` -- fmt, clippy at
# `-D warnings`, no-`#[allow]`, audit, tests, the 95% coverage floor -- asks
# `cargo` to build, and `cargo` builds with whatever `rustup` currently calls
# `stable`. A background `rustup update` therefore rewrites every one of those
# verdicts without touching this repo: a new lint in clippy turns a green gate
# red on a commit that changed nothing, and a new edition or feature gate in
# rustc turns a build green-to-red the same way. A gate whose input is not
# pinned is a gate whose failures cannot be attributed.
#
# `stable` and not a point release, deliberately. Point-pinning (`1.99.0`) would
# freeze the toolchain harder, but it also means the pin itself rots: the next
# `rustup update` is a no-op, the component list below is never re-verified, and
# a CVE in the pinned compiler is not something anyone notices. What this file
# actually guarantees is the CHANNEL -- "always the newest stable", which is the
# house rule -- and it guarantees that a `rustup update` reaches this repo
# deliberately, in a commit that says so, instead of by background.
#
# The components are named because every one of them is used by the gate and
# none of them is guaranteed to be present: rustfmt for `cargo fmt --check`,
# clippy for `clippy -D warnings`. A missing component makes `rustup` install it
# on demand today, and becomes a hard error once the default toolchain is one
# `cargo` cannot silently resolve -- so naming them here is what keeps the
# failure at the point of the change rather than in a `rust-toolchain` error
# halfway through a push.
#
# Shape matched from `~/Projects/gates_of_heck/rust-toolchain.toml`, so one edit
# (a background `rustup update` + this file) keeps every repo on the same
# channel and the same components.
[toolchain]
channel = "stable"
components = ["rustfmt", "clippy"]
