# Twitter/X Configuration
state_file = "~/.twitter_summary_state.json"
output_dir = "~/Documents/twitter_summaries"
llm_url = "http://localhost:1337"
# No `model` key here: the summarizer's model is `conf/config.toml
# [best_models].summarize`, derived from the eval sweep. A key here named an
# uninstalled model for a month and nothing read it (2026-09-19).
chrome_cookies_db = "~/Library/Application Support/Google/Chrome/Default/Cookies"
max_scrolls = 1200

# x.com GraphQL endpoint markers. DATA, not code: both collectors read this
# table, so one edit here moves both sides together. DO NOT EDIT unless x.com
# renames their API — these identify the protocol, not operator preference.
# The Following (reverse-chron) endpoint is what the ID-set A/B compares;
# `HomeTimeline` without the `Latest` infix is the For You feed, and mixing
# the two makes collected sets incomparable.
[endpoints]
timeline = ["HomeTimeline", "HomeLatestTimeline"]
following = "HomeLatestTimeline"

# Summarizer fallback policy. DATA, not code: `models` are tried after the
# intended model, in order, when it is unserved, fails, or answers with
# nothing usable; `preferred` is the substring preference order used to pick
# a substitute when the intended model is absent from the server's roster.
# `foundation` is the on-device model and is always kept as the last resort.
# `TWITTER_FALLBACK_MODELS=a,b` overrides `models` for one run.
[fallback]
models = ["foundation"]
preferred = ["raptor", "muse", "foundation", "qwen", "gemma"]
