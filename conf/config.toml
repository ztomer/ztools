llm_url = "http://localhost:1337"
default_model = "qwen3.6-35b-a3b-mxfp8-mtp"

# Best models per task based on v0.9.4 full 8-model sweep.
# Rationale documented in docs/eval_calibration_2026-07-11.md.
[best_models]
think = "qwen3.6-35b-a3b-mxfp8-mtp"
json = "foundation"
  # Fastest (8s) at 100% on all weekend/json tasks.
summarize = "qwen-agentworld-35b-a3b-mxfp8"
  # 65% on summarize (tied best), 100% contradiction resistance, fast (15s).
  # Prev gemma-4-12b was 65% but 0% contradiction (parrots falsehoods).
filename = "foundation"
  # 100% on filename task, fastest (0.3s).
vlm = "qwen3.6-35b-a3b-mxfp8-mtp"

[timeouts]
think = 600
json = 600
summarize = 300
filename = 120
vlm = 600

[max_tokens]
think = 16000
json = 16000
summarize = 16000
filename = 1000
vlm = 16000

filename_models = [
  "foundation",
  "qwen-agentworld-35b-a3b-mxfp8",
  "qwen3.6-35b-a3b-mxfp8-mtp",
]

[prompts]
filename = """
Output ONLY the filename string (no JSON, no code blocks).
Use lowercase, underscores for spaces, no special characters.
Keep it under 50 characters.

TEXT: {text}
"""

[eval_inputs]
filename = [
  "business lessons",
  "scott adams advice",
]

image_filename = [
  ["How to manage underperformers", "how_to_manage_underperformers"],
  ["Scott Adams essays", "scott_adams_essays"],
  ["10 powerful sentences by Scott Adams navigating failure, ambition: ...", "scott_adams_powerful_sentences"],
  ["15 years of business lessons in <500 words: ...", "business_lessons"],
  ["Be delusional. Believe that you have the ability...", "delusional_belief"],
  ["How To Prioritize Like A Pro - Noemi Kis: ...", "prioritize_pro"],
  ["elon musk: how to win at founding - taking risk...", "musk_founding_tips"],
  ["context engineering template - comprehensive guide...", "context_engineering"],
]
