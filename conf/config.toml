llm_url = "http://localhost:1337"

# PROVISIONAL, 2026-08-15. qwen3.6-35b-a3b-mxfp8-mtp and qwen-agentworld-35b-a3b-mxfp8
# were deleted from disk at some point after the entries below were written, and
# nothing noticed: the server answered `default_model`, think, vlm and 2 of the 3
# filename_models with HTTP 404, which broke `wk` outright (both of its tasks routed
# there). lib/model_resolve.py now substitutes at call time and says so, but a
# substitution is a stopgap that fires on every run — these names are the fix.
#
# Use the 4-BIT qwen3.8, not the MXFP8 one, and the reason is counter-intuitive
# enough to write down: the HIGHER bit encoding is unusable on this host. osaurus
# mmaps weights, and 27GB cannot stay in this machine's page cache, so the MXFP8
# build re-reads weights from SSD on every token. Same model, same architecture,
# same machine, measured back to back:
#
#     qwen3.8-27b-mxfp8   27GB   TTFT 143.0s   0.08 tok/s   cold start 182s
#     qwen3.8-27b-4bit    15GB   TTFT  30.7s  26-35 tok/s   cold start 0.8s
#
# 326x on decode. Bits buy quality only while the weights stay resident; past that
# they buy nothing because the model cannot finish. The threshold on this host is
# between 18GB (fine) and 27GB (dead) -- docs/MODEL_QUIRKS.md lists the five
# hypotheses ruled out before that one.
#
# Still PROVISIONAL as a TASK ASSIGNMENT: the above is a speed argument, not a
# quality measurement, and nothing here has been evaluated on these tasks. Re-derive
# the whole table from a sweep (docs/BACKLOG.md item 1) and stamp the date when you
# do, so the next roster change invalidates it visibly.
default_model = "qwen3.8-27b-4bit"

# Fallback chain for `rn`'s filename task, tried in order.
# Top-level keys must stay ABOVE the first [table] header — a bare key after one
# belongs to that table, which is how this list spent its life inside
# [max_tokens] where get_filename_models() could never see it.
filename_models = [
  "foundation",
  "qwen3.8-27b-4bit",
]

# Order lib/model_resolve.py tries when a configured model is not installed and no
# stand-in of its own family is either. Entries are matched as substrings against the
# server's roster, so they name FAMILIES, not tags — a tag here would rot the same way
# the ones above did. foundation leads because it is on-device and always present.
model_fallback_chain = ["foundation", "qwen", "gemma", "ornith", "nemotron"]

# json/summarize/filename below are the surviving entries from the task-673 /
# task-899 sweep (docs/DEEP_MODEL_VS_GEMINI_EVALUATION.md). Those numbers predate the
# harness fixes that stopped `filename` scoring 100 for an unfilled {text} placeholder,
# so treat them as unverified too — they are merely the ones still installed.
[best_models]
think = "qwen3.8-27b-4bit"  # provisional, see above
json = "foundation"
  # Fastest (0.7s) at 100% on filename and 91.6% on file_summary context-bounding.
summarize = "gemma-4-12b-it-mxfp8"
  # 100% on summarize, flawless ## Executive Summary narrative and connecting verbs.
filename = "foundation"
  # 100% on filename task, fastest (0.3s).
vlm = "qwen3.8-27b-4bit"  # provisional, see above

[timeouts]
think = 600
json = 600
summarize = 300
filename = 120
vlm = 600

[max_tokens]
think = 16000
json = 16000
summarize = 16000
filename = 1000
vlm = 16000

[prompts]
filename = """
Output ONLY the filename string (no JSON, no code blocks).
Use lowercase, underscores for spaces, no special characters.
Keep it under 50 characters.

TEXT: {text}
"""

