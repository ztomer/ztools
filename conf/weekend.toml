# Weekend Planner Configuration

# NOTE: top-level keys MUST precede the first [table] / [[array-of-tables]].
# `exclude_places` used to sit at the bottom of this file, which TOML parsed as a
# key of the LAST [[children]] entry -- so weekend/config.py:54 read [] and the
# whole exclusion list was silently ignored. See docs/REPORT_WEAKNESS_CLASSES.md C8.
exclude_places = [
  "Canada's Wonderland",
  "Ontario Science Centre",
  "Toronto Zoo",
  "The Art of the Brick",
  "Reptilia",
  "ROM",
  "Ripley's",
  "Little Canada",
  "LEGOLAND",
  "CN Tower",
  "Museum of Illusions",
  "Royal Ontario Museum (ROM)",
  "Toronto Islands",
  "Sky Zone Toronto",
  "LEGOLAND Discovery Centre Toronto",
  "LEGOLAND Discovery Centre Toronto (Vaughan Mills)",
]

[location]
city = "Vaughan"
region = "Toronto"
timezone = "America/Toronto"
latitude = 43.8361
longitude = -79.5083

# In-region evidence for the scrape filter (`has_region_evidence`): place
# names that keep a result. DATA, not code -- edit this list, not the
# implementations, which read it from this file on both sides.
#
# Deliberately NO bare "york": measured 2026-09-13 on 40 live results, every
# bare-york-only hit was York-UK/York-PA junk (9/9) with zero local reliance.
# Local texts say "North York", "York Region", "Yorkdale", or "York
# University" -- positive evidence must be compound, never a bare substring.
[region]
in_region = [
  "toronto",
  "vaughan",
  "markham",
  "richmond hill",
  "mississauga",
  "brampton",
  "scarborough",
  "north york",
  "etobicoke",
  "york region",
  "york university",
  "woodbridge",
  "concord",
  "thornhill",
  "maple",
  "kleinburg",
  "aurora",
  "newmarket",
  "oakville",
  "burlington",
  "pickering",
  "ajax",
  "whitby",
  "oshawa",
  "milton",
  "caledon",
  "king city",
  "stouffville",
  "bolton",
  "georgetown",
  "hamilton",
  "brantford",
  "guelph",
  "barrie",
  "niagara",
  "gta",
  "greater toronto",
  "ontario",
  "durham region",
  "peel region",
  "halton",
  "yorkdale",
  "downsview",
]

# Foreign-city veto for the Rust filter only: a result naming one of these is
# rejected even when a local token also matches ("New York" contains "york").
# Python's filter is whitelist-only by design and does not read this list.
foreign = [
  "new york",
  "nyc",
  "san diego",
  "dublin",
  "acropolis",
  "athens",
  "chicago",
  "london",
  "paris",
  "los angeles",
  "miami",
  "astana",
  "berlin",
  "tokyo",
]

