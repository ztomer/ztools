# Qwopus model configuration
# Based on Qwen3.6-27B distilled from Claude Opus

name: qwopus
timeout: 120

field_mapping:
  category: target_ages
  context_highlight: price
  type: weather
  event_date: day
  end_date: end_date

prompts:
  json: |
    Output JSON now. Use EXACT schema.

  weekend_fixed: |
    Output JSON now. Use EXACT schema: {"fixed_activities": [{"name": "str", "location": "str", "target_ages": "str", "price": "str", "weather": "str"}]}

    Extract 8-10 popular {location} venues for families with kids ages {age_range}.

    CRITICAL: Each item MUST have these exact fields:
    - target_ages: "{age_range}" (NOT category, NOT type)
    - price: "$18-35 per child" or "$25-35 per family" (NOT context_highlight, NOT description)
    - weather: "indoor" or "outdoor" (NOT setting, NOT category)
    - name: official name (NOT description)
    - location: city/neighborhood only

    EXCLUDE these places: {exclusions}

    Output ONLY JSON. No extra text.

  weekend_transient: |
    Output JSON now. Schema: {"transient_events": [{"name": "str", "location": "str", "target_ages": "str", "price": "str", "duration": "str", "weather": "str", "day": "str"}]}

    Find 5-10 events for {date_range} in {location}. Kids ages {age_range}.

    Use ONLY these values:
    - day: Friday, Saturday, or Sunday
    - target_ages: "{age_range}"
    - price: "$20-30 per child" or "free"
    - duration: "2-3 hours" or "all day"
    - weather: "indoor" or "outdoor"

    Output ONLY JSON. No extra text.

  summarize: |
    Create a structured summary of this timeline. Start with a brief TL;DR paragraph that captures the overall narrative. Then organize events into topic sections with ## headers, using bullet points. Include who (@user mentions), what happened, and when. Use natural connecting language between related events.

    <timeline>
    {}
    </timeline>

  filename: |
    Convert the following text into a short filename.
    Use lowercase, underscores for spaces, no special characters.
    Keep it under 50 characters.
    Output ONLY the filename - no explanations, no questions.

    Input: {}

  file_summary: |
    Output JSON array. One entry per file. Each must have "path" and "desc" fields.
    Example: [{"path": "eval_lib.py", "desc": "model evaluation functions"}, {"path": "validators.py", "desc": "validation logic"}]
    NO single summary. NO inference from filename.

    {}

key_mappings:
  event: name
  title: name
  activity: name
  venue: location
  address: location
  place: location
  age_group: target_ages
  ages: target_ages
  age_range: target_ages
  cost: price
  pricing: price
  fee: price
  type: weather
  category: weather

quirks:
  - type: prefix
    pattern: "Output JSON now."
    reason: Prevents thinking blocks in JSON output

top_keys:
  fixed:
    - fixed_activities
    - year_round_fixed_activities
    - venues
    - places
    - activities
    - items
  transient:
    - transient_events
    - events
    - activities
    - recommendations
