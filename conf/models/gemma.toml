name = "gemma"
timeout = 120

[field_mapping]
activity = "name"
event_name = "name"
venue = "location"

[prompts]
json = "Output JSON now. Use EXACT schema."

weekend_transient = """
Output JSON now. Use EXACT schema: {"transient_events": [{"name": "str", "location": "str", "target_ages": "str", "price": "str", "duration": "str", "weather": "str", "day": "str"}]}

Extract 5-10 events for {date_range} in {location}. Kids ages {age_range}.
Set weather to "outdoor", "indoor", or "both" based on the event type.

Output ONLY JSON array. No explanations.
"""

weekend_fixed = """
Output JSON now. Use EXACT schema: {"fixed_activities": [{"name": "str", "location": "str", "target_ages": "str", "price": "str", "weather": "str"}]}

Extract and format the family-friendly venues from this list as JSON. Return ALL venues.

{}

Use the values from the source data as-is. Output ONLY JSON array. No explanations.
"""

summarize = """
Create a structured summary of this timeline.
Start with a brief overall paragraph capturing the main narrative.
Then organize events into topic sections with ## headers, using bullet points.
Include who (@user mentions), what happened, and when.
Use connecting phrases and narrative verbs to show how events relate.

<timeline>
{}
</timeline>
"""

filename = """
Output JSON now. Schema: {{"filename": "str"}}
You are a file naming assistant. Output ONLY JSON.
Use lowercase, underscores for spaces, no special characters.
Keep it under 50 characters.
Output ONLY JSON. No extra text.

TEXT: {}
"""

file_summary = """
Output JSON array. One entry per file. Each must have "path" and "desc" fields.
Example: [{"path": "eval_lib.py", "desc": "model evaluation functions"}, {"path": "validators.py", "desc": "validation logic"}]
NO single summary. NO inference from filename.

{}
"""

[key_mappings]
event = "name"
title = "name"
activity = "name"
venue = "location"
address = "location"
place = "location"
age_group = "target_ages"
ages = "target_ages"
age_range = "target_ages"
cost = "price"
pricing = "price"
fee = "price"
type = "weather"
category = "weather"

[top_keys]
fixed = ["fixed_activities", "year_round_fixed_activities", "weekend_data", "target_weekend", "venues", "places", "activities", "items"]
transient = ["transient_events", "events", "weekend_data", "target_weekend", "activities", "recommendations"]

[[quirks]]
type = "prefix"
pattern = "Output JSON now."
reason = "Prevents thinking blocks in JSON output"

[[quirks]]
type = "transform"
name = "gemma_weekend_forecast"
description = "Transform gemma's weekend_forecast structure to events list"
when = "gemma returns weekend_forecast object with nested day objects"
