# --------------------------------------------------------------------------------
# Per-model overrides
# --------------------------------------------------------------------------------
# Reached through the ARCHITECTURE, not the name: `ev --capabilities` records each
# model's `model_type`, and get_model_family trims qwen3_5 / qwen3_5_moe / qwen3_5_mtp
# to "qwen". That is why a model with no "qwen" in its id lands here.
#
# `max_tokens` here NARROWS a task budget for one model. It is deliberately EMPTY.
#
# A blanket cap was tried and removed. These models overrun their budget on hard
# prompts -- they stream chain of thought into `reasoning_content`, leave `content`
# empty, and never stop -- and capping the budget does stop that. It also removes
# thinking from every request that was working, including the ones where thinking is
# what makes the answer good. That trades a visible failure for an invisible one, and
# it decides in config a question that should be measured: does this model do BETTER
# with thinking, on this task?
#
# The overrun is now caught at runtime instead. lib/llm/streaming.py watches the SSE
# stream and aborts only a run that is already doomed -- reasoning past
# REASONING_OVERRUN_FRACTION of the budget with `content` still empty, at which point
# the remaining budget cannot hold an answer anyway. Long thinking is allowed; only
# runaway thinking is stopped, and the abort is recorded so "does thinking work for
# this model" becomes an eval result rather than a config guess.
#
# Put a cap here only for a model measured to be BETTER capped, with the numbers.
