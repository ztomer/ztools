[package]
name = "ztools"
version = "2.3.0"
edition = "2021"
description = "Native Rust port of ztools: Twitter summarizer, weekend planner, image renamer, model eval."
license = "MIT"

[lints.clippy]
# Adopted 2026-09-07. This crate had no clippy policy at all, so `pedantic` and
# `nursery` had never run against it -- 865 findings nothing reported. Fixed
# rather than baselined; the gate runs at `-D warnings`, so this is a ratchet.
#
# NOT included, deliberately: `unwrap_used` / `expect_used` / `panic`. Those are
# `restriction` rather than `pedantic`, and turning them on here is a
# correctness campaign with its own review, not a lint sweep.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
comfy-table = "8.0.0"
dirs = "5"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "0.8"

[dev-dependencies]
serial_test = "3"