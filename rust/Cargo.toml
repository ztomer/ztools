[package]
name = "ztools"
version = "2.1.14"
edition = "2021"
description = "Native Rust port of ztools: Twitter summarizer, weekend planner, image renamer, model eval."
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
camoufox = { path = "../vendor/camoufox-rs" }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
comfy-table = "8.0.0"
dirs = "5"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "0.8"

[dev-dependencies]
serial_test = "3"