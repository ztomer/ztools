name: Config Debt Gate
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check for new config debt
        shell: python3 {0}
        run: |
          import re, subprocess, sys
          from pathlib import Path

          ROOT = Path('.')
          CHECKER = ROOT / 'tools' / 'check_config_debt.py'

          # Determine base ref. The first push of a branch reports an all-zero
          # `before` SHA, which makes `git diff` error out — and an unchecked
          # returncode turned that into an empty diff and a silent pass.
          event_name = "${{ github.event_name }}"
          if event_name == "pull_request":
              BASE = "${{ github.event.pull_request.base.sha }}"
          else:
              BASE = "${{ github.event.before }}"

          def _rev_exists(rev):
              if not rev or set(rev) <= {'0'}:
                  return False
              return subprocess.run(['git', 'cat-file', '-e', rev + '^{commit}'],
                                    capture_output=True).returncode == 0

          if not _rev_exists(BASE):
              subprocess.run(['git', 'fetch', 'origin', 'main'], capture_output=True)
              fallback = subprocess.run(['git', 'merge-base', 'origin/main', 'HEAD'],
                                        capture_output=True, text=True)
              BASE = fallback.stdout.strip()
              if not BASE:
                  print('Cannot resolve a base commit to diff against.')
                  sys.exit(1)
              print(f'Base ref unusable; falling back to merge-base {BASE}')

          # Get changed Python files
          r = subprocess.run(['git', 'diff', '--name-only', BASE, 'HEAD', '--', '*.py'],
                             capture_output=True, text=True)
          if r.returncode != 0:
              print(f'git diff failed: {r.stderr.strip()}')
              sys.exit(1)
          changed = [f for f in r.stdout.strip().split('\n') if f]
          if not changed:
              sys.exit(0)

          def get_added_lines(file_path, base):
              r = subprocess.run(
                  ['git', 'diff', '-U0', base, 'HEAD', '--', file_path],
                  capture_output=True, text=True,
              )
              if r.returncode != 0:
                  print(f'git diff failed for {file_path}: {r.stderr.strip()}')
                  sys.exit(1)
              added = set()
              for line in r.stdout.split('\n'):
                  m = re.match(r'^@@ -\d+(?:,\d+)? \+(\d+)(?:,(\d+))? @@', line)
                  if m:
                      start = int(m.group(1))
                      count = int(m.group(2)) if m.group(2) else 1
                      for i in range(start, start + count):
                          added.add(i)
              return added

          errors = []
          for f in changed:
              fp = ROOT / f
              if not fp.exists() or fp.suffix != '.py':
                  continue
              added_lines = get_added_lines(f, BASE)
              if not added_lines:
                  continue
              r = subprocess.run(
                  [sys.executable, str(CHECKER), str(fp)],
                  capture_output=True, text=True,
              )
              if r.returncode == 0:
                  continue
              for line in r.stdout.split('\n'):
                  m = re.match(r'^\s+L\s*(\d+)', line)
                  if m and int(m.group(1)) in added_lines:
                      errors.append(line)

          if errors:
              print('New config debt violations in this change:\n')
              print('\n'.join(errors))
              sys.exit(1)
          sys.exit(0)
