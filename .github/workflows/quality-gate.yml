name: Quality Gate

# Structural gate (not disciplinary): blocks merges that regress code quality.
# Rust-only gate: clippy + cargo test. No Python checks — Python reference
# is preserved for A/B parity verification only; production runs execute Rust.
on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  gate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rust tests and clippy
        run: |
          cd rust
          cargo clippy --all-targets -- -D warnings
          cargo test