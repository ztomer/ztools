name: Release

# Builds a clean source tarball for a pushed tag and computes its sha256 so the
# Homebrew formula in ztomer/homebrew-tap can be updated. The tarball layout
# matches what GitHub auto-generates for a tag (ztools-<version>/ prefix), which
# Homebrew strips automatically.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  tarball:
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.sha.outputs.sha256 }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build source tarball (GitHub-style prefix)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          python3 - <<PY
          import tarfile, os
          VERSION = os.environ["VERSION"]
          EXCL = {'.git','.venv','__pycache__','.mypy_cache','.pytest_cache',
                  '.ruff_cache','dist','build','logs','eval_outputs','node_modules',
                  '.github','.githooks','tests','benchmarks'}
          def keep(p):
              return not any(x in EXCL for x in p.split('/'))
          with tarfile.open(f"ztools-{VERSION}.tar.gz", "w:gz") as t:
              for root, dirs, files in os.walk('.'):
                  if not keep(root):
                      dirs[:] = [d for d in dirs if keep(os.path.join(root, d))]
                      continue
                  for f in files:
                      fp = os.path.join(root, f)
                      if keep(fp):
                          t.add(fp, arcname=f"ztools-{VERSION}/{fp}")
          print("built")
          PY

      - name: Compute sha256
        id: sha
        run: echo "sha256=$(shasum -a 256 ztools-${{ steps.ver.outputs.version }}.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Upload tarball to release
        uses: softprops/action-gh-release@v2
        with:
          files: ztools-${{ steps.ver.outputs.version }}.tar.gz

      - name: Report sha256
        run: |
          echo "Tarball sha256: ${{ steps.sha.outputs.sha256 }}"
          echo "Update ztools.rb:"
          echo "  url \"https://github.com/ztomer/ztools/archive/refs/tags/v${{ steps.ver.outputs.version }}.tar.gz\""
          echo "  sha256 \"${{ steps.sha.outputs.sha256 }}\""

      - name: Upgrade Homebrew Tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set. Skipping automatic Homebrew tap upgrade."
            exit 0
          fi
          python3 tools/upgrade_tap.py \
            --version "${{ steps.ver.outputs.version }}" \
            --sha256 "${{ steps.sha.outputs.sha256 }}"
