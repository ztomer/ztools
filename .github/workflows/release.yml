name: Release

# Computes the sha256 of the tarball the Homebrew formula actually points at —
# GitHub's auto-generated source archive for the tag — and updates the formula
# in ztomer/homebrew-tap to match.
#
# It used to build its OWN curated tarball and shasum THAT while the formula URL
# named the auto-generated archive: two different files, so `brew install`
# failed checksum verification on every release. `tools/release.sh` (the manual
# path) already shasums the archive, and both paths write the same formula — so
# they must agree on which artifact is canonical. The archive is: it exists for
# every tag with no upload step, and Homebrew strips its `ztools-<version>/`
# prefix automatically.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  tarball:
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.sha.outputs.sha256 }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Compute sha256 of the published tarball
        id: sha
        env:
          TARBALL_URL: https://github.com/${{ github.repository }}/archive/refs/tags/${{ github.ref_name }}.tar.gz
        run: |
          set -euo pipefail
          # The archive is generated on demand; retry so a cold first request
          # cannot silently yield an empty file and a checksum for nothing.
          for attempt in 1 2 3 4 5; do
            if curl -fsSL "$TARBALL_URL" -o release.tar.gz && [ -s release.tar.gz ]; then
              break
            fi
            echo "attempt $attempt: tarball not ready yet, retrying..." >&2
            sleep 5
          done
          [ -s release.tar.gz ] || { echo "Could not download $TARBALL_URL" >&2; exit 1; }
          tar -tzf release.tar.gz > /dev/null  # it must be a real tarball
          echo "sha256=$(shasum -a 256 release.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Report sha256
        run: |
          echo "Tarball sha256: ${{ steps.sha.outputs.sha256 }}"
          echo "Update ztools.rb:"
          echo "  url \"https://github.com/${{ github.repository }}/archive/refs/tags/${{ github.ref_name }}.tar.gz\""
          echo "  sha256 \"${{ steps.sha.outputs.sha256 }}\""

      - name: Upgrade Homebrew Tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set. Skipping automatic Homebrew tap upgrade."
            exit 0
          fi
          python3 tools/upgrade_tap.py \
            --version "${{ steps.ver.outputs.version }}" \
            --sha256 "${{ steps.sha.outputs.sha256 }}"
